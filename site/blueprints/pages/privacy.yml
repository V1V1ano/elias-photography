title: Data Privacy
icon: file-document

# The data privacy page is not part of the main navigation.
# It is unlisted and linked from the footer only.
status:
  unlisted:
    label: Public
    text: The privacy page is reachable from the footer.
  listed: false
  draft:
    label: Draft
    text: Only visible in the Panel.

options:
  changeStatus: true
  changeSlug: false
  changeTemplate: false
  delete: false

columns:
  - width: 2/3
    sections:
      intro:
        type: fields
        fields:
          headline:
            label: Page headline
            type: text
            required: true
            placeholder: Data Privacy
            help: Main heading shown on the data privacy page.

      section1:
        type: fields
        label: 1. Section
        fields:
          section1_headline:
            label: Headline
            type: text
            required: true
            placeholder: Verantwortlicher
          section1_text:
            label: Content
            type: textarea
            size: medium
            buttons:
              - bold
              - italic
              - link
              - email
              - ul
              - ol

