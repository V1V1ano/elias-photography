title: Imprint
icon: file-document

# The imprint is not part of the main navigation.
# It is unlisted and linked from the footer only.
status:
  unlisted:
    label: Public
    text: The imprint is reachable from the footer.
  listed: false
  draft:
    label: Draft
    text: Only visible in the Panel.

options:
  changeStatus: true
  changeSlug: false
  changeTemplate: false
  delete: false

columns:
  - width: 2/3
    sections:
      intro:
        type: fields
        fields:
          headline:
            label: Page headline
            type: text
            required: true
            placeholder: Imprint
            help: Main heading shown on the imprint page.

      section1:
        type: fields
        label: 1. Section
        fields:
          section1_headline:
            label: Headline
            type: text
            required: true
            placeholder: Angaben gemäß § 5 TMG
          section1_text:
            label: Content
            type: textarea
            size: medium
            buttons:
              - bold
              - italic
              - link
              - email
              - ul
              - ol

      section2:
        type: fields
        label: 2. Section
        fields:
          section2_headline:
