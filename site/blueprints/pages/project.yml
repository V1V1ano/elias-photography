title: Project
icon: page

columns:
  - width: 1/2
    fields:
      type:
        label: Type
        type: text
        help: for example photo or video

  - width: 1/2
    fields:
      occasion:
        label: Occasion
        type: text
        help: for example tour, event, studio shoot

  - width: 1/3
    fields:
      year:
        label: Year
        type: text

  - width: 1/3
    fields:
      city:
        label: City
        type: text

  - width: 1/3
    fields:
      place:
        label: Specific place
        type: text

  - width: 1/1
    fields:
      description:
        label: Description
        type: textarea
        size: small

  - width: 1/1
    fields:
      photoSections:
        label: Photo sections
        type: blocks
        help: Add photo sections (1 or 2 images). Drag & drop to reorder.
        fieldsets:
          oneImage:
            label: 1-picture component
            icon: image
            preview: fields
            fields:
              image:
                label: Image
                type: files
                multiple: false
                layout: cards
                size: small
                image:
                  cover: true
                uploads:
                  template: image

          twoImages:
            label: 2-picture component
            icon: images
            preview: fields
            fields:
              left:
                label: Left image
                type: files
                width: 1/2
                multiple: false
                layout: cards
                size: small
                query: page.images
                uploads:
                  template: image

              right:
                label: Right image
                type: files
                width: 1/2
                multiple: false
                layout: cards
                size: small
                query: page.images
                uploads:
                  template: image