# Each page blueprint must have a title, the title may be different from the file name
title: Home

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: 🏠

# Page options allow you to control how users can interact with the page.
# Here we prevent changing the page status (the home page cannot be renamed or deleted by default)
# More about page options: https://getkirby.com/docs/reference/panel/blueprints/page#options
options:
  changeStatus: false

# Here we define an info section and a pages section (`photography`)
sections:
  content:
    type: fields
    fields:
      heromobile:
        label: Hero image (mobile)
        type: files
        max: 1
        multiple: false
        layout: cards
        image:
          ratio: 9/16
          cover: true
        uploads:
          template: image
        query: page.images.template("image")
        width: 1/2
        help: Full-screen image shown on mobile.
      herodesktop:
        label: Hero image (desktop)
        type: files
        max: 1
        multiple: false
        layout: cards
        image:
          ratio: 16/9
          cover: true
        uploads:
          template: image
        query: page.images.template("image")
        width: 1/2
        help: Full-screen image shown on desktop.

      heroheadline:
        label: Hero headline
        type: textarea
        size: small
        buttons: false
        help: Big blue headline shown in the top-left of the hero.

  projects:
    headline: Projects
    type: pages
    parent: site.find("projects")
    templates:
      - project
    layout: list
    help: Manage your project pages here. Click one to edit, or create a new project.
    create:
      - project
    status: listed

